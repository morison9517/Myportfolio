# =============================================================================
# .air.toml = 「保存したら自動でビルドし直して再起動する」道具の設定
#
#   Goは書いたコードを翻訳(ビルド)してから動く言語なので、
#   何もしないとコードを直すたびに手で止めて翻訳し直すことになる。
#   それを自動化するのが air。
#
#   ▼ 開発中の流れ
#       .go を保存      → airが自動で作り直して再起動(数秒)→ ブラウザ再読み込み
#       .html/.css/.js  → 再起動不要。ブラウザ再読み込みだけで反映される
#
#   ★HTMLを監視対象に入れていない理由
#     開発中はページを表示するたびにHTMLを読み込み直す作りにしてあるため
#     (internal/view/render.go)。再起動しないぶん反映が速い。
# =============================================================================

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"

  # .go を保存したときだけ作り直す。
  # html も見ているのは、go:embed でアプリ本体に取り込むHTMLを置いたときのため
  # (取り込んだHTMLは作り直さないと反映されない)。
  # web/ は下の exclude_dir で除外しているため、普通のテンプレートはここに含まれない。
  include_ext = ["go", "html"]

  # ★.env は見張っていない。
  #
  #   設定(.env)は起動したときに1回だけ読み込む作りなので、
  #   書き換えたら手で再起動すること:
  #       docker compose restart web
  #
  #   ★再起動を忘れると「.env に書いたのに設定が空のまま」になり、
  #     ログインできない・メールが送られない、という状態になる。
  #     起動ログの [config] の行で、読み込めたかどうかが分かる。

  # 見張らなくてよい場所。ここが多いほど動作が軽くなる。
  exclude_dir = ["tmp", "web", "docs", ".git", ".vscode"]

  # 保存直後に何度も走らないよう、少し待ってからまとめて処理する(ミリ秒)。
  delay = 400

  # ★ビルドに失敗したとき、古いアプリを動かし続ける。
  #   書きかけの状態でアプリごと落ちると、他のメンバーの確認まで止まってしまう。
  stop_on_error = true

  # ★Windowsで開発する人がいる場合に必須。
  #   WindowsのフォルダをDockerの箱に繋いでいると「保存された」という通知が
  #   箱の中まで届かないことがある。定期的に見に行く方式に切り替えて確実にする。
  poll = true
  poll_interval = 500

[log]
  time = false

[misc]
  # 終了時に tmp/ を掃除する。
  clean_on_exit = true
