# =============================================================================
# Nginx = 本番でお客さんを最初に迎える受付
#
#   ▼ なぜ Gin の前に置くのか
#
#     Gin は「考えて返事を作る」のが仕事です。
#     でもCSSや画像は考える必要がなく、ただファイルを渡すだけ。
#     それを Gin にやらせると、考える窓口が塞がってしまいます。
#
#     お店に例えると、Nginx が入口の案内係です。
#       「パンフレットください」→ 案内係がその場で渡す(静的ファイル)
#       「注文したいです」    → 奥のカウンターに通す(Gin)
#
#   ▼ ★Django版との違い
#
#     Django には collectstatic という「CSSを1か所に集めるコマンド」があり、
#     集めた先を Nginx が配ります。
#     Gin にはその仕組みがないので、web/static/ を直接配ります。
#     compose.prod.yml でそのフォルダを Nginx に見せています。
#
#   ▼ このファイルを直したとき
#
#         docker compose -f compose.prod.yml restart nginx
#
#   ▼ 開発中は使いません
#
#     compose.yml(開発用)には Nginx がありません。
#     開発中は Gin が全部自分で配るので、これで困りません。
# =============================================================================

# =============================================================================
# ▼ HTTPS の構成(2つの server ブロック)
#
#   80番  … 「HTTPSで来てください」と案内するだけ。中身は返さない。
#           例外は証明書の更新確認(/.well-known/acme-challenge/)で、
#           ここだけはHTTPのまま応答する必要がある。
#
#   443番 … 本体。サイトの中身はすべてこちら。
#
#   ★証明書が無い状態で443のブロックを読ませると Nginx は起動しません。
#     先に証明書を取ってから、この設定で起動してください(docs/DEPLOY.md)。
# =============================================================================

server {
    listen 80;
    server_name _;

    # ★Let's Encrypt の更新確認。ここだけは下のリダイレクトより先に書くこと。
    #   後ろに書くと、確認のアクセスまでHTTPSへ飛ばされて更新に失敗する。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # それ以外は全部HTTPSへ。301 = 「恒久的に移動した」の意味。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # ★nginx 1.25.1 以降は `listen 443 ssl http2;` ではなく、
    #   http2 を独立した行に書くのが正しい書き方。
    listen 443 ssl;
    http2 on;

    server_name _;

    # 証明書。certbot が取ったものを読むだけ(compose.prod.yml でマウント)。
    # ★ドメインを変えたら、このパスの mrrn.jp も変える。
    ssl_certificate     /etc/letsencrypt/live/mrrn.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrrn.jp/privkey.pem;

    # 古い規格を切り、接続の使い回しを有効にする。
    # ★TLSv1.0/1.1 は脆弱性があり、主要ブラウザも既に使わない。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ▼ ★HSTS(「このサイトは今後HTTPSでしか開くな」とブラウザに覚えさせる)
    #
    #   有効にすると、次回以降ブラウザがHTTPを試さなくなり安全になる。
    #   ただし★一度覚えさせると、期間中は取り消せない。
    #   証明書が切れるとサイトが完全に開けなくなるため、
    #   HTTPSが安定して動くことを数日確認してから、下の行を有効にすること。
    #
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # --- 圧縮 ---
    #
    # ▼ 何をしているか
    #
    #   CSS・JS・HTMLは文字の塊なので、送る前に圧縮すると 1/4〜1/5 になる。
    #   ブラウザ側が自動で解凍するので、こちらの書き方は何も変えなくてよい。
    #
    # ▼ ★画像を対象にしていない理由
    #
    #   jpg / png / ico は既に圧縮済みのファイル形式。
    #   もう一度圧縮してもほとんど縮まず、CPUを使うだけ損になる。
    #   svg は中身がテキストなので対象に入れている。
    gzip on;

    # 小さいファイルは圧縮しても効果が薄いうえ、圧縮の手間のほうが大きい。
    gzip_min_length 1024;

    # 圧縮の強さ(1〜9)。上げるほど縮むがCPUを食う。6が一般的な落としどころ。
    gzip_comp_level 6;

    # ★text/html は常に対象なので、ここに書くと重複警告が出る。書かないこと。
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    # 「圧縮版を返した」という印を付ける。
    # これが無いと、途中のキャッシュが圧縮版を非対応のブラウザに渡してしまう。
    gzip_vary on;

    # アップロードの上限。ここを超えると Nginx が 413 で弾く。
    # ★router.go の MaxMultipartMemory と同じ値にしておく。
    #   片方だけ大きくしても意味がなく、「なぜか大きい画像だけ失敗する」になる。
    client_max_body_size 16M;

    # --- CSS / JS / ロゴ(自分たちが用意したファイル) ---
    #
    # web/static/ をそのまま配る。
    # expires 30d = ブラウザに30日キャッシュさせる(2回目以降が速くなる)。
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # --- 利用者が上げたファイル(プロフィールアイコン) ---
    #
    # ★こちらは箱の外の保管庫にある。箱を作り直しても消えない。
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        access_log off;
    }

    # --- それ以外は全部 Gin に渡す ---
    location / {
        # "web" は compose.prod.yml のサービス名。Dockerが住所に変換してくれる。
        proxy_pass http://web:8080;

        # ★この4行が無いと Gin が困る
        #
        #   Nginx を通すと、Gin から見た相手は「Nginx」になってしまう。
        #   本当のアクセス元やドメインが分からなくなるので、ここで教えている。
        #
        #   ★Gin側でも .env の TRUSTED_PROXIES を設定しないと、
        #     これらのヘッダーは無視されます(詐称を防ぐため)。両方必要です。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 返事が遅いときに待つ時間。既定(60秒)だと重い処理で切れることがある。
        proxy_read_timeout 120s;
    }
}
